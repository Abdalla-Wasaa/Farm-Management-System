[project]
name = "poultry-market"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3", "httpx>=0.28,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
