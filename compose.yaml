services:
  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: farm
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm"]
      interval: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://farm:${POSTGRES_PASSWORD}@db:5432/farm
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}
  api:
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://farm:${POSTGRES_PASSWORD}@db:5432/farm
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://farm:${POSTGRES_PASSWORD}@db:5432/farm
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_URL:-http://localhost:8001}
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
